[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "live-translate-subtitles-service"
version = "0.0.0"
description = "Local speech recognition and translation service"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.1,<2",
  "numpy>=2,<3",
  "nvidia-cublas-cu12>=12.4,<13; platform_system == 'Windows'",
  "nvidia-cudnn-cu12>=9,<10; platform_system == 'Windows'"
]
translation = [
  "ctranslate2>=4,<5",
  "opencc-python-reimplemented>=0.1.7,<1",
  "sentencepiece>=0.2,<1",
  "transformers>=4.46,<6"
]
models = [
  "faster-whisper>=1.1,<2",
  "numpy>=2,<3",
  "nvidia-cublas-cu12>=12.4,<13; platform_system == 'Windows'",
  "nvidia-cudnn-cu12>=9,<10; platform_system == 'Windows'",
  "opencc-python-reimplemented>=0.1.7,<1",
  "torch>=2.6,<3",
  "sentencepiece>=0.2,<1",
  "transformers>=4.46,<6"
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/live_translate_subtitles"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true

[project.scripts]
live-translate-native-host = "live_translate_subtitles.main:main"
live-translate-download-stt = "live_translate_subtitles.download_model:main"
live-translate-download-translation = "live_translate_subtitles.download_translation_model:main"
