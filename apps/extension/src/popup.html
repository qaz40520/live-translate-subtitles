<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { width: 320px; margin: 0; background: #111827; color: #f8fafc; }
      main { padding: 16px; }
      h1 { margin: 0 0 8px; font-size: 18px; }
      #status { min-height: 36px; margin: 0 0 12px; color: #bfdbfe; font-size: 13px; line-height: 1.4; }
      .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      button { border: 0; border-radius: 7px; padding: 9px 12px; font-weight: 650; cursor: pointer; }
      button:disabled { cursor: default; opacity: .45; }
      #start { background: #2563eb; color: white; }
      #stop { background: #374151; color: white; }
      fieldset { margin: 16px 0 0; padding: 12px; border: 1px solid #374151; border-radius: 8px; }
      legend { padding: 0 5px; color: #d1d5db; font-size: 12px; }
      label { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; margin: 9px 0; font-size: 13px; }
      select, input[type="range"] { width: 100%; box-sizing: border-box; }
      select { border: 1px solid #4b5563; border-radius: 5px; padding: 5px; background: #1f2937; color: inherit; }
      output { color: #93c5fd; font-variant-numeric: tabular-nums; }
      .range-value { grid-template-columns: 92px 1fr 42px; }
      input[type="color"] { width: 100%; height: 28px; border: 0; padding: 0; background: transparent; }
    </style>
  </head>
  <body>
    <main>
      <h1>即時翻譯字幕</h1>
      <p id="status">準備就緒</p>
      <div class="actions">
        <button id="start" type="button">開始翻譯</button>
        <button id="stop" type="button" disabled>停止</button>
      </div>
      <fieldset>
        <legend>辨識與字幕（變更會立即套用）</legend>
        <label>
          語音語言
          <select id="source-language">
            <option value="ko">韓文</option>
            <option value="ja">日文</option>
            <option value="en">英文</option>
            <option value="auto">自動偵測</option>
          </select>
        </label>
        <label>
          顯示內容
          <select id="display-mode">
            <option value="bilingual">原文＋翻譯</option>
            <option value="translated">只顯示翻譯</option>
          </select>
        </label>
        <label>
          位置
          <select id="position">
            <option value="bottom">畫面下方</option>
            <option value="middle">畫面中央</option>
          </select>
        </label>
        <label class="range-value">
          字體大小
          <input id="font-size" type="range" min="18" max="40" step="1" />
          <output id="font-size-value"></output>
        </label>
        <label class="range-value">
          背景深度
          <input id="background-opacity" type="range" min="35" max="95" step="1" />
          <output id="background-opacity-value"></output>
        </label>
        <label>
          文字顏色
          <input id="text-color" type="color" />
        </label>
      </fieldset>
      <script type="module" src="popup.js"></script>
    </main>
  </body>
</html>
